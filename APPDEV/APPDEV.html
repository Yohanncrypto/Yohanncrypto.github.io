<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPDEV</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12 d-flex align-items-center justify-content-center position-relative">
                <div class="position-relative text-center">
                    <h1 class="text-white typewriter" id="projectsTitle"
                        style="font-size: clamp(2rem, 5vw, 3rem); font-family: 'Orbitron', sans-serif; 
                        letter-spacing: 2px;  margin-left: 10px;
                        margin-right: 20px;">
                        APPDEV
                    </h1>
                </div>
            </div>
        </div>
    </div>
    
    <div class="swiper mySwiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide">
                <div class="card">
                    <h5 class="customHeading">Activity 1</h5>
                    <iframe src="A01/Johann Act 1.html" class="cardIframe"></iframe>
                    <div class="card-body">
                        <a href="A01/Johann Act 1.html" class="cardTitle">Click Here</a>
                    </div>
                </div>
            </div>

            <div class="swiper-slide">
                <div class="card">
                    <h5 class="customHeading">Activity 2</h5>
                    <iframe src="A02/Project2.html" class="cardIframe"></iframe>
                    <div class="card-body">
                        <a href="A02/Project2.html" class="cardTitle">Click Here</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
    <script>
        var swiper = new Swiper(".mySwiper", {
            slidesPerView: 3, 
            centeredSlides: true, 
            loop: true, 
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
            on: {
                slideChangeTransitionEnd: function () {
                    document.querySelectorAll(".swiper-slide").forEach(slide => {
                        slide.classList.remove("active-slide");
                    });
                    document.querySelector(".swiper-slide-active").classList.add("active-slide");
                }
            }
        });
    </script>
</body>
</html>
