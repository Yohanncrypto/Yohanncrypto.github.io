<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="assets/images/J.png" type="image/png">
    <title>Johann Portfolio - Showcase</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo"><img src="assets/images/J.png" alt="Logo"></div>
        <span class="nav-site">Yohanncrypto.github.io</span>
    </nav>

    <!-- HERO -->
    <section class="hero-section" id="heroSection">
        <div class="profile-container" id="profilePic">
            <img src="assets/images/19_De Vera Johann Emmanuel B.jpg" alt="Johann Emmanuel B. Vera" />
        </div>
        <div class="hero-content">
            <h1>Hi! I am Johann Emmanuel B. Vera</h1>
            <p class="subtitle">Creative Developer | Graphic Designer | Artist</p>
        </div>
        <div class="scroll-indicator" id="startBtn">Tap</div>
    </section>

    <!-- PROJECTS -->
    <div class="projects-layout" id="projectsLayout">
      <div class="scroll-track" id="scrollTrack">

        <div class="left-content" id="leftContent">
            <div class="project-text-group active" id="text-0">
                <span class="project-tag">Web Design</span>
                <h2>Projects</h2>
                <p></p>
                <a href="projects/projects.html" class="cta-button">Open Laptop</a>
            </div>
            <div class="project-text-group" id="text-1">
                <span class="project-tag">Illustration</span>
                <h2>Artworks</h2>
                <p></p>
                <a href="projects/M02/index.html" class="cta-button">View Canvas</a>
            </div>
        </div>

        <div class="right-side" id="itemContainer">

            <!-- WEB -->
            <div class="item-section">
                <div class="showcase-wrapper">
                    <div class="float-img web-float-a" data-float="0a"><img src="assets/images/2.svg" alt="" /></div>
                    <div class="showcase-item laptop-mockup" id="item-0">
                        <div class="screen-content theme-web"><h3>Web Projects</h3></div>
                    </div>
                    <div class="float-img web-float-b" data-float="0b"><img src="assets/images/4.svg" alt="" /></div>
                </div>
            </div>

            <!-- ART -->
            <div class="item-section">
                <div class="showcase-wrapper">
                    <div class="float-img art-float-a" data-float="1a"><img src="assets/images/5.svg" alt="" /></div>
                    <div class="showcase-item canvas-mockup" id="item-1">
                        <div class="screen-content theme-art"><h3 style="color:#444;">Artwork</h3></div>
                    </div>
                    <div class="float-img art-float-b" data-float="1b"><img src="assets/images/6.svg" alt="" /></div>
                </div>
            </div>

        </div>

      </div>

      <div class="scroll-dots" id="scrollDots">
          <div class="dot active"></div>
          <div class="dot"></div>
      </div>
    </div>

    <script>
        const heroSection    = document.getElementById('heroSection');
        const projectsLayout = document.getElementById('projectsLayout');
        const profilePic     = document.getElementById('profilePic');
        const scrollTrack    = document.getElementById('scrollTrack');
        const itemContainer  = document.getElementById('itemContainer');
        const leftContent    = document.getElementById('leftContent');
        const items          = document.querySelectorAll('.showcase-item');
        const wrappers       = document.querySelectorAll('.showcase-wrapper');
        const texts          = document.querySelectorAll('.project-text-group');
        const dots           = document.querySelectorAll('.dot');

        const floats = [
            [document.querySelector('[data-float="0a"]'), document.querySelector('[data-float="0b"]')],
            [document.querySelector('[data-float="1a"]'), document.querySelector('[data-float="1b"]')],
        ];

        const isMobile = () => window.matchMedia('(max-width: 768px)').matches;

        // On desktop, scroll-track is the single native scroll container (left + right
        // both live inside it). On mobile, right-side (itemContainer) scrolls on its own.
        const scrollEl = () => isMobile() ? itemContainer : scrollTrack;

        let isHeroVisible = true;
        let scrollCooldown = false;
        let cursorX = 0, cursorY = 0, targetX = 0, targetY = 0;

        /* ── NAVIGATION ── */
        function goToProjects() {
            if (!isHeroVisible) return;
            isHeroVisible = false;
            heroSection.classList.add('hidden');
            projectsLayout.classList.add('visible');
            scrollCooldown = true;
            setTimeout(() => { scrollCooldown = false; }, 1000);
        }

        function goToHero() {
            if (isHeroVisible || scrollCooldown) return;
            isHeroVisible = true;
            heroSection.classList.remove('hidden');
            projectsLayout.classList.remove('visible');
            scrollEl().scrollTop = 0;
        }

        window.addEventListener('wheel', (e) => {
            if (isHeroVisible) {
                if (e.deltaY > 30) goToProjects();
                return;
            }
            if (scrollEl().scrollTop <= 5 && e.deltaY < -30) goToHero();
        }, { passive: true });

        /* ── TOUCH ── */
        let touchStartY = 0;

        heroSection.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        heroSection.addEventListener('touchend', (e) => {
            if (touchStartY - e.changedTouches[0].clientY > 40) goToProjects();
        }, { passive: true });

        itemContainer.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        itemContainer.addEventListener('touchend', (e) => {
            const dy = touchStartY - e.changedTouches[0].clientY;
            if (itemContainer.scrollTop <= 2 && dy < -40) goToHero();
        }, { passive: true });

        /* ── CTA ── */
        document.getElementById('startBtn').addEventListener('click', goToProjects);

        /* ── DOTS ── */
        function updateDots(i) {
            dots.forEach((d, idx) => d.classList.toggle('active', idx === i));
        }

        /* ── MOUSE PARALLAX (desktop only) ── */
        document.addEventListener('mousemove', (e) => {
            if (isMobile()) return;
            const x = (e.clientX / window.innerWidth)  * 2 - 1;
            const y = (e.clientY / window.innerHeight) * 2 - 1;
            if (isHeroVisible) profilePic.style.transform = `rotateX(${-y*15}deg) rotateY(${x*15}deg)`;
            targetX = x * 10; targetY = y * 10;
        });

        /* ── ANIMATE LOOP ── */
        function animate() {
        const mobile = isMobile();
        if (!mobile) {
            cursorX += (targetX - cursorX) * 0.06;
            cursorY += (targetY - cursorY) * 0.06;
        }

        const FLOAT_SPEED = 1.65;
        const container = scrollEl();
        const containerRect = container.getBoundingClientRect();
        const containerCenter = containerRect.top + containerRect.height / 2;

        let closestIndex = 0;
        let minDistance = Infinity;

        // Identify active item based on proximity to center
        items.forEach((item, index) => {
            const rect = item.getBoundingClientRect();
            const itemCenter = rect.top + rect.height / 2;
            const distance = Math.abs(containerCenter - itemCenter);

            if (distance < minDistance) {
                minDistance = distance;
                closestIndex = index;
            }
        });

        // Update active text and dot indicators
        texts.forEach((t, i) => t.classList.toggle('active', i === closestIndex));
        updateDots(closestIndex);

        // Apply scaling and opacity
        items.forEach((item, index) => {
            const rect = item.getBoundingClientRect();
            const itemCenter = rect.top + rect.height / 2;
            const distance = Math.abs(containerCenter - itemCenter);
            const maxDist = containerRect.height / 1.2;

            let scale = Math.max(0.75, Math.min(1, 1 - (distance / maxDist) * 0.25));

            if (!mobile) {
                if (index === closestIndex) {
                    item.style.transform = `scale(${scale}) translate(${cursorX}px, ${cursorY}px)`;
                    floats[index].forEach(f => {
                        if (f) f.style.transform = `translate(${cursorX * FLOAT_SPEED}px, ${cursorY * FLOAT_SPEED}px)`;
                    });
                } else {
                    item.style.transform = `scale(${scale})`;
                    floats[index].forEach(f => { if (f) f.style.transform = 'translate(0,0)'; });
                }
            } else {
                item.style.transform = `scale(${scale})`;
                if (wrappers[index]) {
                    // Smooth fade instead of sudden zero-opacity cutoff
                    const fadeOpacity = Math.max(0.15, 1 - (distance / (containerRect.height * 0.55)));
                    wrappers[index].style.opacity = fadeOpacity.toString();
                }
            }
        });

        requestAnimationFrame(animate);
    }
        animate();
    </script>
</body>
</html>
