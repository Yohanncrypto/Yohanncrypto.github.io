<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBDEV</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container-fluid">
        <div class="row">
            <div class="col-12 d-flex align-items-center justify-content-center position-relative">
                <div class="position-relative text-center">
                    <h1 class="text-white typewriter" id="projectsTitle"
                        style="font-size: clamp(2rem, 5vw, 3rem); font-family: 'Orbitron', sans-serif; 
                        letter-spacing: 2px; margin-left: 10px; margin-right: 20px;">
                        WEBDEV
                    </h1>
                </div>
            </div>
        </div>
    </div>

    <div class="swiper mySwiper">
        <div class="swiper-wrapper">

            <div class="swiper-slide" data-bg="linear-gradient(to right, #2E2E2E, #0C2458)">
                <div class="card">
                    <h5 class="customHeading">Activity 4</h5>
                    <iframe src="A04/Johann Act 4.html" class="cardIframe"></iframe>
                    <div class="card-body">
                        <a href="A04/Johann Act 4.html" class="cardTitle">Click Here</a>
                    </div>
                </div>
            </div>

            <div class="swiper-slide" data-bg="linear-gradient(to right, #2E7286, #2575fc, #43EDA9)">
                <div class="card">
                    <h5 class="customHeading">Activity 5</h5>
                    <iframe src="A05/act5.html" class="cardIframe"></iframe>
                    <div class="card-body">
                        <a href="A05/act5.html" class="cardTitle">Click Here</a>
                    </div>
                </div>
            </div>

            <div class="swiper-slide" data-bg="linear-gradient(to right, #540606, #0C2458)">
                <div class="card">
                    <h5 class="customHeading">Activity 6</h5>
                    <iframe src="A06/act6.html" class="cardIframe"></iframe>
                    <div class="card-body">
                        <a href="A06/act6.html" class="cardTitle">Click Here</a>
                    </div>
                </div>
            </div>

            <div class="swiper-slide" data-bg="linear-gradient(to right, #2E2E2E, #AA7A5A)">
                <div class="card">
                    <h5 class="customHeading">Activity 7</h5>
                    <iframe src="A07/Act7.html" class="cardIframe"></iframe>
                    <div class="card-body">
                        <a href="A07/Act7.html" class="cardTitle">Click Here</a>
                    </div>
                </div>
            </div>

            <div class="swiper-slide" data-bg="linear-gradient(to right, #2E2E2E, #540606)">
                <div class="card">
                    <h5 class="customHeading">Midterm Part 1</h5>
                    <iframe src="M01/Midterm1.html" class="cardIframe"></iframe>
                    <div class="card-body">
                        <a href="M01/Midterm1.html" class="cardTitle">Click Here</a>
                    </div>
                </div>
            </div>

            <div class="swiper-slide" data-bg="linear-gradient(to right, #2E2E2E, #f5af19)">
                <div class="card">
                    <h5 class="customHeading">Midterm Part 2</h5>
                    <iframe src="M02/Midterm2.html" class="cardIframe"></iframe>
                    <div class="card-body">
                        <a href="M02/Midterm2.html" class="cardTitle">Click Here</a>
                    </div>
                </div>
            </div>

        </div>

        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
    <script>
        var swiper = new Swiper(".mySwiper", {
            slidesPerView: 3, 
            centeredSlides: true, 
            loop: true, 
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
            on: {
                slideChangeTransitionEnd: function () {
                    document.querySelectorAll(".swiper-slide").forEach(slide => {
                        slide.classList.remove("active-slide");
                    });

                    let activeSlide = document.querySelector(".swiper-slide-active");
                    activeSlide.classList.add("active-slide");

                    document.body.style.background = activeSlide.getAttribute("data-bg");
                }
            }
        });

        document.addEventListener("DOMContentLoaded", function () {
            let initialSlide = document.querySelector(".swiper-slide-active");
            if (initialSlide) {
                document.body.style.background = initialSlide.getAttribute("data-bg");
            }
        });
    </script>

</body>
</html>
