<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Plantenings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <nav class="navbar" style="background-color: #7ba390;">
        <div class="container-fluid">
            <div class="navbar-brand">
                <div class="fas fa-leaf p-2" id="navbar-icon">
                    Plantenings
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row pt-3">
            <div class="col-12 col-md-9">
                <div class="row">
                    <div class="col pb-3">
                        <div class="card p-3 topcontainer">
                            <div class="d-flex flex-start flex-row categories" id="categories"></div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <div class="card p-3 maincontainer">
                            <div class="d-flex flex-row flex-wrap" id="maincontainer"
                                style="display: flex; justify-content: center; align-items: flex-start; width: 100%; overflow-y: auto;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-3">
                <div class="card p-3 shadow-sm" style="height: 100%; overflow: hidden;">
                    <div id="cartDetails">
                        <div class="cart-header mb-3" style="font-size: 1.5rem; font-weight: 600; color: #007579;">
                            Cart
                        </div>
                        <div id="receipt" style="font-size: 1rem; color: #333;">
                        </div>
                        <div class="mt-4 d-flex flex-row justify-content-between align-items-center"
                            style="font-size: 1.1rem; color: #555;">
                            <div><b>TOTAL</b></div>
                            <div><b id="totalValue" style="color: #28a745; font-size: 1.2rem;">$0.00</b></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button class="cart-button" onclick="toggleCartDetails()">
        <i class="fas fa-shopping-cart" style="font-size: 24px;"></i>
    </button>

    <script>
  var categories = [];
        var products = [];
        var total = 0;


        const getAllCategories = async () => {
            fetch('http://localhost/A04_BE/categories.php')
                .then(response => response.json())
                .then(data => {
                    categories = data;
                    loadCategories();
                });
        }


        const getAllProducts = async (categoryID) => {
            var categoryData = {
                categoryID: categoryID
            };


            fetch('http://localhost/A04_BE/products.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(categoryData)
            })
                .then(response => response.json())
                .then(data => {
                    products = data;
                    loadProducts();
                })
        }


        function loadCategories() {
            var categoriesContainer = document.getElementById("categories");
            categoriesContainer.innerHTML = "";
            categories.forEach((category) => {
                var categoryBackgroundColor = category.categoryBackgroundColor || '#F0F0F0';
                categoriesContainer.innerHTML +=
                    '<div onclick="getAllProducts(' + category.categoryID + ')" class="card mx-1 custom-button p-3 text-center" style="background-color: ' + categoryBackgroundColor + ';">' +
                    '<img src="' + category.image + '" alt="Category Image" class="img-fluid" />' +
                    '<small>' + category.name + '</small>' +
                    '</div>';
            });
        }


        function loadProducts() {
            var maincontainer = document.getElementById("maincontainer");
            maincontainer.innerHTML = "";


            products.forEach(product => {
    var backgroundColor = product.backgroundColor || '#C1E1C1';
    var backgroundEffectColor = product.backgroundColor || '#A0E4B8';


    maincontainer.innerHTML +=
        '<div onclick="addToReceipt(\'' + product.price + '\', \'' + product.code + product.sizeCode +'\')" class="card mx-1 my-2 content p-2 custom-card">' +
        '<div class="product-container" style="background-color: ' + backgroundColor + ';">' +
        '<img src="' + product.image + '" alt="Product Image" class="img-fluid product-image" />' +
        '<div class="background-color-effect" style="background-color: ' + backgroundEffectColor + ';"></div>' +
        '</div>' +
        '<div class="product-text mt-2">' +
        '<small>' + product.name + ' ' + product.size + '</small>' +
        '<div class="product-price" style="font-weight: bold;">₱' + parseFloat(product.price).toFixed(2) + '</div>' +
        //'<div class="product-description" style="font-size: 0.9em; color: #555;">' + product.description + '</div>' +  Hindi nailagay sa last activity
        '</div>' +
        '</div>';
});


        }


        function addToReceipt(price, name) {
            total += parseFloat(price);
            document.getElementById("totalValue").innerText = '₱' + total.toFixed(2);
            document.getElementById("receipt").innerHTML +=
                '<div>' + name + ': ₱' + parseFloat(price).toFixed(2) + '</div>';
        }


        function toggleCartDetails() {
            const cartDetails = document.getElementById("cartDetails");
            cartDetails.style.display = cartDetails.style.display === "none" ? "block" : "none";
        }
        window.onload = getAllCategories;


    </script>
</body>

</html>
