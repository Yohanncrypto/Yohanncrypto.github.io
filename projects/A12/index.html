<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Music Blog</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="icon" href="img/Vinyl Icon.png" type="image/x-icon">
    <style>
    body {
        background-color: #121212;
        color: #f0f0f0;
        font-family: Arial, sans-serif;
    }
    .iframe-container {
        position: relative;
        width: 100%;
        padding-top: 56.25%; 
        overflow: hidden;
        border-radius: 12px;
        background-color: #1e1e1e;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
    }

    .iframe-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
        border-radius: 12px;
    }
</style>

</head>

<body>

    <div class="container my-5">
        <h1 class="mb-3">Johann's Top Artist</h1>
        <p class="mb-4 text-secondary">Search your favorite Artist</p>

        <div class="iframe-container">
            <iframe src="player.html" title="Music Player"></iframe>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
