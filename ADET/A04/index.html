        var total = 0;

        function loadCategories() {
            var categoriesContainer = document.getElementById("categories");
            products.forEach(function (product, index) {
                var categoryBackgroundColor = product.backgroundColor || '#F0F0F0';
                categoriesContainer.innerHTML +=
                    '<div onclick="loadProducts(' + index + ')" class="card mx-1 custom-button p-3 text-center" style="background-color: ' + categoryBackgroundColor + ';">' +
                    '<img src="' + product.image + '" alt="Category Image" class="img-fluid" />' +
                    '<small>' + product.category + '</small>' +
                    '</div>';
            });
        }

        function loadProducts(categoryIndex) {
            var maincontainer = document.getElementById("maincontainer");
            maincontainer.innerHTML = "";

            products[categoryIndex].contents.forEach(function (content) {
                content.sizes.forEach(function (size) {

                    var backgroundColor = content.backgroundColor || '#C1E1C1';
                    var backgroundEffectColor = content.backgroundColor || '#A0E4B8';

                    maincontainer.innerHTML +=
                        '<div onclick="addToReceipt(\'' + size.price + '\', \'' + content.code + size.code + '\')" class="card mx-1 my-2 content p-2 custom-card">' +
                        '<div class="product-container" style="background-color: ' + backgroundColor + ';">' +
                        '<img src="' + size.image + '" alt="Product Image" class="img-fluid product-image" />' +
                        '<div class="background-color-effect" style="background-color: ' + backgroundEffectColor + ';"></div>' +
                        '</div>' +
                        '<div class="product-text mt-2">' +
                        '<small>' + content.name + ' ' + size.name + '</small>' +
                        '<div class="product-price" style="font-weight: bold;">₱' + parseFloat(size.price).toFixed(2) + '</div>';

                    '<div class="product-description" style="font-size: 0.9em; color: #555;">' + size.description + '</div>' +
                        '</div>' +
                        '</div>';
                });
            });
        }

        function addToReceipt(price, name) {
            total += parseFloat(price); 
            document.getElementById("totalValue").innerText = '₱' + total.toFixed(2); 
            document.getElementById("receipt").innerHTML +=
                '<div>' + name + ': ₱' + parseFloat(price).toFixed(2) + '</div>';
        }


        function toggleCartDetails() {
            const cartDetails = document.getElementById("cartDetails");
            cartDetails.style.display = cartDetails.style.display === "none" ? "block" : "none";
        }
