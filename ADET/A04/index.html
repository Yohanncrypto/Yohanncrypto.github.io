<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Plantenings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <style>
        body {
            color: white;
            margin: 0;
            font-family: 'Orbitron', 'Roboto', sans-serif;
        }

        .custom-button {
            color: white;
            width: 150px;
            height: 180px;
            padding: 15px;
            font-size: 1.2rem;
            transition: transform 0.3s ease;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .custom-button:hover {
            background-color: rgb(240, 240, 240);
            cursor: pointer;
        }

        .custom-button img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.3s ease;
        }

        .custom-button:hover img {
            transform: scale(1.05);
        }

        .img-fluid {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .topcontainer {
            overflow-x: hidden;
            padding: 10px 0;
            border-radius: 0;

        }

        .categories {
            display: flex;
            gap: 10px;
            padding: 0 10px;
            flex-wrap: nowrap;
            overflow-x: auto;
            scroll-behavior: smooth;
        }

        .custom-button {
            flex-shrink: 0;
            width: 180px;
            height: 180px;
            overflow-x: hidden;
        }

        .custom-card {
            width: 250px;
            height: auto;
            border-radius: 0px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 2px 2px 5px #b1b8c1, -2px -2px 5px #ffffff;

            transition: all 0.3s ease;
        }

        .custom-card:hover {
            box-shadow: 5px 5px 10px #b1b8c1, -5px -5px 10px #ffffff;
        }


        .maincontainer {
            height: 60dvh;
            overflow-y: auto;
            border-radius: 0;

        }

        .card {
            border-radius: 0;
        }

        @media (max-width: 576px) {
            .custom-button {
                width: 150px;
                margin-bottom: 10px;
                height: 180px;
                font-size: 0.9rem;
            }

            .custom-button img {
                max-width: 100%;
                height: 100%;
            }

            .topcontainer {
                height: auto;
                padding: 10px 0;
            }

            .categories {
                display: flex;
                gap: 10px;
                overflow-x: auto;
                flex-wrap: nowrap;
                -webkit-overflow-scrolling: touch;
            }

            .maincontainer {
                padding-bottom: 20px;
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
            }

            .col-9 {
                padding-right: 0;
            }

            .col-3 {
                padding-left: 0;
                padding-top: 20px;
            }

            .custom-button p {
                font-size: 0.8rem;
            }

            #cartDetails {
                display: none;
            }


            .cart-button {
                position: fixed;
                bottom: 20px;
                right: 20px;
                padding: 12px 25px;
                background-color: #7ba390;
                color: white;
                border: none;
                font-size: 14px;
                border-radius: 0px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                cursor: pointer;
            }

            .cart-button:hover {
                background-color: #00b395;
            }

            #cartDetails {
                position: fixed;
                bottom: 70px;
                right: 20px;
                background-color: white;
                border-radius: 0px;
                padding: 15px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                width: 200px;
                max-height: 300px;
                overflow-y: auto;
                z-index: 999;
            }
        }

        @media (min-width: 577px) {
            .cart-button {
                display: none;
            }
        }

        @media (max-width: 400px) {
            .custom-button p {
                font-size: 0.7rem;
            }

            .topcontainer {
                padding: 10px 0;
            }

            .custom-button {
                height: 180px;
            }

            .custom-button img {
                max-width: 100%;
            }

            .cart-button {
                padding: 10px 20px;
                font-size: 12px;
                height: 70px;
                width: 100px;
                border-radius: 100px;
            }

            #cartDetails {
                width: 180px;
            }
        }
    </style>
</head>

<body>

                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <div class="card p-3 maincontainer">
                            <div class="d-flex flex-row flex-wrap" id="maincontainer"
                                style="display: flex; justify-content: center; align-items: flex-start; width: 100%; overflow-y: auto;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-3">
                <div class="card p-3" style="height: 100%; overflow: hidden;">
                    <div id="cartDetails">
                        <div class="cart-header">Cart</div>
                        <div id="receipt"></div>
                        <div class="mt-4 d-flex flex-row justify-content-between">
                            <div><b>TOTAL</b></div>
                            <div><b id="totalValue">0</b></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button class="cart-button" onclick="toggleCartDetails()">

    </button>

        var total = 0;

        function loadCategories() {
            var categoriesContainer = document.getElementById("categories");
            products.forEach(function (product, index) {
                var categoryBackgroundColor = product.backgroundColor || '#F0F0F0';
                categoriesContainer.innerHTML +=
                    '<div onclick="loadProducts(' + index + ')" class="card mx-1 custom-button p-3 text-center" style="background-color: ' + categoryBackgroundColor + ';">' +
                    '<img src="' + product.image + '" alt="Category Image" class="img-fluid" />' +
                    '<small>' + product.category + '</small>' +
                    '</div>';
            });
        }

        function loadProducts(categoryIndex) {
            var maincontainer = document.getElementById("maincontainer");
            maincontainer.innerHTML = "";

            products[categoryIndex].contents.forEach(function (content) {
                content.sizes.forEach(function (size) {

                    var backgroundColor = content.backgroundColor || '#C1E1C1';
                    var backgroundEffectColor = content.backgroundColor || '#A0E4B8';

                    maincontainer.innerHTML +=
                        '<div onclick="addToReceipt(\'' + size.price + '\', \'' + content.code + size.code + '\')"class="card mx-1 my-2 content p-2 custom-card">' +
                        '<div class="product-container" style="background-color: ' + backgroundColor + ';">' +
                        '<img src="' + size.image + '" alt="Product Image" class="img-fluid product-image" />' +
                        '<div class="background-color-effect" style="background-color: ' + backgroundEffectColor + ';"></div>' +
                        '</div>' +
                        '<div class="product-text mt-2">' +
                        '<small>' + content.name + ' ' + size.name + '</small>' +
                        '</div>' +
                        '</div>';
                });
            });
        }

        function addToReceipt(price, name) {
            total += parseInt(price);
            document.getElementById("totalValue").innerText = total;
            document.getElementById("receipt").innerHTML +=
                '<div>' + name + ': ' + price + '</div>';
        }

        function toggleCartDetails() {
            const cartDetails = document.getElementById("cartDetails");
            cartDetails.style.display = cartDetails.style.display === "none" ? "block" : "none";
        }

        window.onload = loadCategories;

    </script>
