<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <style>
        .custom-button {
            width: 150px;
            height: 180px;
            padding: 15px;
            font-size: 1rem;
            transition: transform 0.3s ease;
        }

        .custom-button:hover {
            background-color: rgb(240, 240, 240);
            cursor: pointer;
        }

        .custom-button img {
            max-width: 100%;
            height: auto;
            margin-bottom: 10px;
            transition: transform 0.3s ease;
        }

        .custom-button:hover img {
            transform: scale(1.1);
           
        }


        .topcontainer {
            height: 30dvh;
            overflow-x: auto;
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
        }

        .maincontainer {
            height: 60dvh;
            overflow-y: auto;
        }

        .custom-button img {
            max-width: 80%;
            height: auto;
            margin-bottom: 10px;
            transition: transform 0.3s ease;
        }

        .custom-button:hover img {
            transform: scale(1.05);
        }

        @media (max-width: 576px) {
            .custom-button {
                width: 100%;
                margin-bottom: 10px;
            }

            .custom-button.content {
                width: 100%;
            }

            .topcontainer {
                height: auto;
            }

            .categories {
                display: block;
                overflow-x: scroll;
            }

            .maincontainer {
                padding-bottom: 20px;
            }

            .col-9 {
                padding-right: 0;
            }

            .col-3 {
                padding-left: 0;
                padding-top: 20px;
            }

            .custom-button p {
                font-size: 0.9rem;
            }

            #cartDetails {
                display: none;
            }

            .cart-button {
                position: fixed;
                bottom: 20px;
                right: 20px;
                padding: 15px 30px;
                background-color: #007bff;
                color: white;
                border: none;
                font-size: 16px;
                border-radius: 50px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                cursor: pointer;
            }

            .cart-button:hover {
                background-color: #0056b3;
            }

            #cartDetails {
                position: fixed;
                bottom: 70px;
                right: 20px;
                background-color: white;
                border-radius: 10px;
                padding: 20px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                width: 250px;
                max-height: 300px;
                overflow-y: auto;
                z-index: 999;
            }
        }

        @media (min-width: 577px) {
            .cart-button {
                display: none;
            }
        }

        @media (max-width: 400px) {
            .custom-button p {
                font-size: 0.8rem;
            }

            .topcontainer {
                padding: 10px 0;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="/docs/5.3/assets/brand/bootstrap-logo.svg" alt="Logo" width="30" height="24"
                    class="d-inline-block align-text-top">
                Bootstrap
            </a>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row pt-3">
            <div class="col-12 col-md-9">
                <div class="row">
                    <div class="col pb-3">
                        <div class="card overflow-scroll p-3 topcontainer">
                            <div class="d-flex flex-start flex-row categories" id="categories"></div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <div class="card overflow-scroll p-3 maincontainer">
                            <div class="d-flex flex-start flex-row flex-wrap" id="maincontainer"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-3">
                <div class="card p-3" style="height: 100%; overflow: hidden;">
                    <div id="cartDetails">
                        <div class="cart-header">Cart</div>
                        <div id="receipt"></div>
                        <div class="mt-4 d-flex flex-row justify-content-between">
                            <div><b>TOTAL</b></div>
                            <div><b id="totalValue">0</b></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button class="cart-button" onclick="toggleCartDetails()">Cart</button>

    <script>
        var products = [
            {
                "category": "Beverage",
                "image": "img/beverages.jpg",
                "contents": [
                    {
                        "isAvailable": true,
                        "name": "Coke",
                        "code": "CK",
                        "image": "img/coke.jpg",
                        "sizes": [
                            { "name": "regular", "code": "RG", "price": 30 },
                            { "name": "medium", "code": "MD", "price": 35 },
                            { "name": "large", "code": "LG", "price": 40 }
                        ]
                    },
                    {
                        "isAvailable": true,
                        "name": "Sprite",
                        "code": "SPRT",
                        "image": "img/sprite.jpg",
                        "sizes": [
                            { "name": "regular", "code": "RG", "price": 30 },
                            { "name": "medium", "code": "MD", "price": 35 },
                            { "name": "large", "code": "LG", "price": 40 }
                        ]
                    },
                    {
                        "isAvailable": true,
                        "name": "Royal",
                        "code": "RYL",
                        "image": "img/royal.jpg",
                        "sizes": [
                            { "name": "regular", "code": "RG", "price": 30 },
                            { "name": "medium", "code": "MD", "price": 35 },
                            { "name": "large", "code": "LG", "price": 40 }
                        ]
                    }
                ]
            },
            {
                "category": "Burgers",
                "image": "img/burgers.jpg",
                "contents": [
                    { "isAvailable": true, "name": "Burger McDo", "code": "BRGR", "image": "img/burger_mcd.jpg", "price": 50 },
                    { "isAvailable": true, "name": "Chicken Burger", "code": "CKN BRGR", "image": "img/chicken_burger.jpg", "price": 50 },
                    { "isAvailable": true, "name": "Cheesy Burger McDo", "code": "CSY BRGR", "image": "img/cheesy_burger.jpg", "price": 50 },
                    { "isAvailable": true, "name": "Cheeseburger", "code": "CSBRGR", "image": "img/cheeseburger.jpg", "price": 50 },
                    { "isAvailable": false, "name": "Big Mac", "code": "BG MAC", "image": "img/big_mac.jpg", "price": 50 }
                ]
            },
            {
                "category": "Pasta",
                "image": "img/pasta.jpg",
                "contents": [
                    { "isAvailable": true, "name": "McSpaghetti", "code": "SPAG", "image": "img/mcspaghetti.jpg", "price": 50 }
                ]
            }
        ];

        var total = 0;

        function loadCategories() {
            var categoriesContainer = document.getElementById("categories");
            products.forEach((product, index) => {
                categoriesContainer.innerHTML += `
                    <div onclick="loadProducts('` + index + `')" class="card mx-1 custom-button p-3 text-center">
                        <img src="` + product.image + `" alt="Category Image" class="img-fluid" />
                        <small>` + product.category + `</small>
                    </div>
                `;
            });
        }

        function loadProducts(categoryIndex) {
            var maincontainer = document.getElementById("maincontainer");
            maincontainer.innerHTML = "";

            if (categoryIndex == 0) {
                products[categoryIndex].contents.forEach(content => {
                    content.sizes.forEach(size => {
                        maincontainer.innerHTML += `
                            <div onclick="addToReceipt('` + size.price + `', '` + content.code + size.code + `')" class="card mx-1 my-2 custom-button content p-3 text-center">
                                <img src="` + content.image + `" alt="Product Image" class="img-fluid" />
                                <small>` + content.name + ' ' + size.code + `</small>
                            </div>
                        `;
                    });
                });
            } else {
                products[categoryIndex].contents.forEach(content => {
                    maincontainer.innerHTML += `
                        <div onclick="addToReceipt('` + content.price + `', '` + content.code + `')" class="card mx-1 my-2 custom-button content p-3 text-center">
                            <img src="` + content.image + `" alt="Product Image" class="img-fluid" />
                            <small>` + content.name + `</small>
                        </div>
                    `;
                });
            }
        }

        function addToReceipt(price, name) {
            total += parseInt(price);
            document.getElementById("totalValue").innerText = total;
            document.getElementById("receipt").innerHTML += `
                <div>${name}: ${price}</div>
            `;
        }

        function toggleCartDetails() {
            const cartDetails = document.getElementById("cartDetails");
            cartDetails.style.display = cartDetails.style.display === "none" ? "block" : "none";
        }

        window.onload = loadCategories;
    </script>
</body>

</html>
