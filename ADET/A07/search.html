<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search Spotify Artist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="img/Vinyl Icon.png" type="image/x-icon">
  <style>
    body {
      background-color: #121212;
      color: #f0f0f0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
    }

    input[type="text"] {
      width: 100%;
      max-width: 400px;
      padding: 12px 16px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 16px;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #1db954;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #1aa34a;
    }
  </style>
</head>
<body>

  <h2>Search for an Artist on Spotify 🎧</h2>
  <input type="text" id="artistInput" placeholder="Enter artist name">
  <button onclick="searchSpotify()">Search</button>

  <script>
    function searchSpotify() {
      const artist = document.getElementById("artistInput").value.trim();
      if (artist) {
        const searchURL = `https://open.spotify.com/search/${encodeURIComponent(artist)}`;
        window.open(searchURL, "_blank");
      } else {
        alert("Please enter an artist name.");
      }
    }
  </script>

</body>
</html>
