<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            <div class="col-12 d-flex align-items-left justify-content-left position-relative">
                <div class="position-relative text-left">
                    <h1 class="text-white typewriter" id="projectsTitle"
                        style="font-size: clamp(2rem, 5vw, 3rem); font-family: 'Orbitron', sans-serif; 
                        letter-spacing: 2px;  margin-left: 30px;
                        margin-right: 20px;">
                        APPDEV
                    </h1>
                </div>
            </div>
        </div>
    </div>
    
    <div class="swiper mySwiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide" data-bg="linear-gradient(to right, #421A6D, #2E2E2E)">
                <div class="card">
                    <h5 class="customHeading">Activity 2</h5>
                    <iframe src="A02/index.php" class="cardIframe"></iframe>
                    <div class="card-body">
                        <a href="A02/index.php" class="cardTitle">Click Here</a>
                    </div>
                </div>
            </div>
            
            <div class="swiper-slide" data-bg="linear-gradient(to right, #F3BA1C, #2E2E2E)">
                <div class="card">
                    <h5 class="customHeading">Activity 3</h5>
                    <iframe src="A03/index.html" class="cardIframe" title="Activity 3"></iframe>
                    <div class="card-body">
                        <a href="A03/index.html" class="cardTitle">Click Here</a>
                    </div>
                </div>
            </div>

            <div class="swiper-slide" data-bg="linear-gradient(to right, #298B57, #2E2E2E)">
                <div class="card">
                    <h5 class="customHeading">Activity 4</h5>
                    <iframe src="A04/index.html" class="cardIframe" title="Activity 4"></iframe>
                    <div class="card-body">
                        <a href="A04/index.html" class="cardTitle">Click Here</a>
                    </div>
                </div>
            </div>

            <div class="swiper-slide" data-bg="linear-gradient(to right, #2E2E2E, #2E2E2E)">
                <div class="card">
                    <h5 class="customHeading">Activity 5</h5>
                    <iframe src="A05/index.html" class="cardIframe" title="Activity 5"></iframe>
                    <div class="card-body">
                        <a href="A05/index.html" class="cardTitle">Click Here</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
    <script>
        var swiper = new Swiper(".mySwiper", {
            slidesPerView: 3, 
            centeredSlides: true, 
            loop: true, 
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
            on: {
                slideChangeTransitionEnd: function () {
                    document.querySelectorAll(".swiper-slide").forEach(slide => {
                        slide.classList.remove("active-slide");
                    });
                    document.querySelector(".swiper-slide-active").classList.add("active-slide");

                    let activeSlide = document.querySelector(".swiper-slide-active");
                    document.body.style.background = activeSlide.getAttribute("data-bg");
                }
            }
        });

        document.addEventListener("DOMContentLoaded", function () {
            let initialSlide = document.querySelector(".swiper-slide-active");
            if (initialSlide) {
                document.body.style.background = initialSlide.getAttribute("data-bg");
            }
        });
    </script>
</body>
</html>
